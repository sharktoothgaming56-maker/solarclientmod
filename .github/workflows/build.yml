name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Tag must match mod_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties ($want)"
            exit 1
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Checksums
        working-directory: build/libs
        run: |
          ls -l
          sha256sum *.jar | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: solarclient-mod-${{ github.sha }}
          path: build/libs/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: solarclient-mod-${{ github.sha }}
          path: libs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" libs/*.jar libs/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "SolarClient mod $GITHUB_REF_NAME" \
            --notes "Built by GitHub Actions from commit $GITHUB_SHA (run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). SHA-256 checksums are in SHA256SUMS.txt."
